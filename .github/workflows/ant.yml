name: CI Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Apache Ant
      run: choco install ant -y

    - name: Refresh environment
      run: refreshenv
      shell: pwsh

    - name: Build with Ant
      run: ant jar

    - name: Run tests
      run: ant ci-test

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/test/results/

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: audiomanager-jar
        path: dist/*.jar
